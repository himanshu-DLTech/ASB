<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Email Template</title>
    <style type="text/css">
        /* Reset styles */
        body,
        table,
        tr,
        td {
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            font-size: 14px;
            line-height: 1.5;
            color: #000000;
            background-color: #f0f0f0;
        }

        /* Main container */
        .container {
            width: 100%;
            max-width: 600px;
            margin: 0 auto;
            background-color: #fbfaff;
            padding: 20px;
            border-radius: 8px;
        }

        /* Header styles */
        .header {
            padding: 10px;
            text-align: center;
            background-color: #4CAF50;
            color: #ffffff;
            border-radius: 8px;
        }

        .header h1 {
            margin: 0;
            font-size: 24px;
            text-transform: uppercase;
        }

        /* Leaderboard styles */
        .leaderboard {
            background-color: #f0f0f0;
            border-radius: 5px;
            box-shadow: 0px 5px 15px 8px #e4e7fb;
            margin: 20px 0;
            overflow-x: auto;
        }

        .leaderboard table {
            width: 100%;
            border-collapse: collapse;
        }

        .leaderboard th,
        .leaderboard td {
            padding: 10px;
            font-size: 14px;
            text-align: left;
            border-bottom: 1px solid #dddddd;
        }

        .leaderboard tr {
            transition: all 0.2s ease-in-out;
        }

        .leaderboard tr:hover {
            background-color: #f9f9f9;
        }

        .leaderboard tr:nth-child(odd) {
            background-color: #f9f9f9;
        }

        .leaderboard .highlight td {
            background-color: #4caf50 !important;
            color: #ffffff;
        }

        .leaderboard .gold-medal {
            height: 25px;
            margin-left: 5px;
            vertical-align: middle;
        }

        .leaderboard .points {
            align-items: center;
        }

        .circle-img {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            object-fit: cover;
        }

        .placeholder {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background-color: #cccccc;
            text-align: center;
            line-height: 30px;
            color: #ffffff;
            font-size: 12px;
        }

        /* Responsive styles */
        @media (max-width: 600px) {
            .header h1 {
                font-size: 20px;
            }

            .leaderboard th,
            .leaderboard td {
                font-size: 12px;
                padding: 8px;
            }

            .gold-medal {
                height: 20px;
                margin-left: 5px;
            }

            .circle-img,
            .placeholder {
                width: 20px;
                height: 20px;
                line-height: 20px;
            }
        }

        @media (max-width: 400px) {
            .header h1 {
                font-size: 18px;
            }

            .leaderboard th,
            .leaderboard td {
                font-size: 10px;
                padding: 6px;
            }

            .gold-medal {
                height: 18px;
                margin-left: 3px;
            }

            .circle-img,
            .placeholder {
                width: 18px;
                height: 18px;
                line-height: 18px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1> WEEKLY LEADERBOARD</h1>
            <h2>{{weekRange}}</h2>
        </div>
        <table width="100%" cellspacing="0" cellpadding="0">
            <tr>
                <td align="left" width="29%">
                    <img src="https://media.licdn.com/dms/image/C510BAQFW2NK11feCHw/company-logo_200_200/0/1631415483428/deep_logictech_india_pvt_ltd_logo?e=2147483647&v=beta&t=a4GJXP7SpXKMjOr4vVN_A8-yF-4vDpVfcxRY5bnfKIw"
                        alt="dlt" style="width: 50px; height: auto;">
                </td>
                <td align="center" width="38%">
                    <h1>DLT / TEKMONKS</h1>
                </td>
                <td align="right" width="29%">
                    <img src="https://media.licdn.com/dms/image/C4E0BAQGdltoPKDMEdw/company-logo_200_200/0/1672702350434/tekmonks_logo?e=2147483647&v=beta&t=Kqn94hRESztz1BZapVba-QaXIrT610xfHo7sVf2IrLw"
                        alt="tkm" style="width: 65px; height: auto;">
                </td>
            </tr>
        </table>

        
        <div class="leaderboard">
            <table>
                <tr>
                    <th>Rank</th>
                    <th>Name</th>
                    <th>Points</th>
                </tr>
                {{#leaderBoard}}
                <tr {{#isFirst}}class="highlight" {{/isFirst}}>
                    <td>{{rank}}</td>
                    <td class="points">{{name}}</td>
                    <td>{{count}}</td>
                </tr>
                {{/leaderBoard}}
            </table>
        </div>
    </div>
</body>

</html>
